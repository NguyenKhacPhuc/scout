name: Feature request
description: Suggest a capability, integration or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to test or do?
      description: The problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
